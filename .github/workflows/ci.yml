name: CI

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Configure GitHub Packages auth
        # The design-system packages (@cp/ui, @cp/tokens) come from GitHub
        # Packages, published by the cp-testt1-09 release workflow. Until that
        # workflow has run once, apps/app declares them as a `link:` to a local
        # checkout and this job cannot install them — see docs/status.md.
        run: pnpm config set //npm.pkg.github.com/:_authToken "${{ secrets.GITHUB_TOKEN }}"
      - run: pnpm install --frozen-lockfile
      - name: Types (hard zero)
        run: pnpm check-types
      - name: Lint (hard zero)
        run: pnpm lint
      - name: Tests
        run: pnpm test
