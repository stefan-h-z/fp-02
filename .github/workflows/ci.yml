name: CI

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:

jobs:
  # Everything that does not need the design system: the product logic, the sync
  # engine, storage, the API client, and the acceptance simulation.
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter "!@fam/app"
      - name: Types (hard zero)
        run: pnpm check-types:core
      - name: Lint (hard zero)
        run: pnpm lint:core
      - name: Tests
        run: pnpm test

  # The app depends on @cp/ui and @cp/tokens. Until the design-system release
  # workflow has published them to GitHub Packages, apps/app declares them as a
  # link into a sibling checkout, which exists on a developer machine and not
  # here — so this job cannot pass yet and is not allowed to block the branch.
  # Remove continue-on-error in the same change that switches the manifest from
  # link: to a published version (see docs/status.md).
  app:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://npm.pkg.github.com
      - name: Install including the design system
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm install --frozen-lockfile
      - run: pnpm check-types
      - run: pnpm lint
